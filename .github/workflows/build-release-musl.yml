# Workflow to build statically linked MUSL based release binaries

name: Build and Release Binaries

on:
  release:
    types: [ "published" ]
  # Allows you to (re-)build the binaries of an existing release from the Actions tab
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload binaries for (e.g. 1.0.11)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build-and-release:
    name: Build for ${{ matrix.target }}
    # native runners for each architecture, no cross compilation needed
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # linker settings for the musl targets live in .cargo/config.toml
      - name: Install linker
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold

      - name: Build binaries
        run: cargo build --release --target ${{ matrix.target }} --bins

      - name: Prepare binaries for upload
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir dist
          for bin_name in lcov2xml cobertura_split; do
            cp "target/${TARGET}/release/${bin_name}" "dist/${bin_name}-${TARGET}"
          done
          cd dist && sha256sum * > "SHA256SUMS-${TARGET}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
