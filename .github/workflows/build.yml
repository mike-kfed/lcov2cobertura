name: Build and Release Binaries

on:
  release:
    types: ["published"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset_suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_suffix: linux-x64-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset_suffix: linux-arm64-musl
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_suffix: win32-x64
          - os: macos-15
            target: aarch64-apple-darwin
            asset_suffix: darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y clang mold

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build binaries
        run: cargo build --release --target ${{ matrix.target }} --bins

      - name: Collect raw binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist-unpacked
          cp "target/${{ matrix.target }}/release/lcov2xml" "dist-unpacked/lcov2xml-${{ matrix.asset_suffix }}"
          cp "target/${{ matrix.target }}/release/cobertura_split" "dist-unpacked/cobertura_split-${{ matrix.asset_suffix }}"

      - name: Collect raw binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist-unpacked -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lcov2xml.exe" "dist-unpacked/lcov2xml-${{ matrix.asset_suffix }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/cobertura_split.exe" "dist-unpacked/cobertura_split-${{ matrix.asset_suffix }}.exe"

      - name: Upload binary assets
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist-unpacked/*
          if-no-files-found: error

  release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist

      - name: Upload assets to version tag release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/*
          overwrite_files: true
