[package]
name = "lcov2xml"
version = "1.0.7"
edition = "2024"
license = "Apache-2.0"
description = "convert LCOV info file to cobertura XML format"
repository = "https://github.com/mike-kfed/lcov2cobertura"
keywords = ["coverage", "gitlab", "cobertura", "lcov"]
categories = ["command-line-utilities"]
rust-version = "1.85"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5", features = ["derive", "help", "std", "usage"], default-features = false }
lcov = "0.8.1"
quick-xml = "0.38.4"
regex = "1.12.2"
rustc-demangle = "0.1.26"

[profile.release]
strip = "symbols"
lto = "fat"
opt-level = "s"

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"
expect_used = "deny"
unimplemented = "deny"
all = "deny"
pedantic = "deny"
